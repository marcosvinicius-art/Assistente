<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wonner Loja — Gestão da Loja</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Caminhos absolutos: a página é servida em /loja (rewrite do vercel.json). -->
  <link rel="stylesheet" href="/loja.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">📱</div>
      <div>
        <strong id="brandName">Wonner Loja</strong>
        <small>Gestão de aparelhos</small>
      </div>
    </div>
    <nav>
      <a href="#dashboard" data-route="dashboard"><span>📊</span> Dashboard</a>
      <a href="#estoque" data-route="estoque"><span>📦</span> Estoque</a>
      <a href="#vendas" data-route="vendas"><span>💰</span> Vendas</a>
      <a href="#caixa" data-route="caixa"><span>🏦</span> Caixa</a>
      <a href="#parcelamento" data-route="parcelamento"><span>💳</span> Parcelamento &amp; Juros</a>
      <a href="#config" data-route="config"><span>⚙️</span> Configurações</a>
    </nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="top-actions">
        <button class="btn ghost" data-action="nova-compra">+ Comprar aparelho</button>
        <button class="btn primary" data-action="nova-venda">+ Nova venda</button>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" data-close aria-label="Fechar">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="auth" id="auth" hidden>
    <form class="auth-card" id="authForm">
      <div class="brand auth-brand">
        <div class="logo">📱</div>
        <div><strong>Wonner Loja</strong><small>Gestão de loja de celulares</small></div>
      </div>
      <h2 id="authTitle">Entrar</h2>
      <p class="hint" id="authHint">Acesse sua loja.</p>
      <label class="field">E-mail<input name="email" type="email" autocomplete="email" required></label>
      <label class="field" id="authSenha">Senha<input name="senha" type="password" autocomplete="current-password" required></label>
      <div class="auth-msg" id="authMsg" hidden></div>
      <button class="btn primary" id="authSubmit">Entrar</button>
      <div class="auth-links">
        <a href="#" data-auth="cadastro">Criar conta</a>
        <a href="#" data-auth="recuperar">Esqueci a senha</a>
        <a href="#" data-auth="login" hidden>Voltar para o login</a>
      </div>
      <div class="auth-sem-acesso" id="authSemAcesso" hidden>
        <a class="btn" href="/">Ir para o app de finanças</a>
        <button type="button" class="btn" data-action="sair">Sair</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div id="recibo"></div>

  <script src="/loja.js"></script>
</body>
</html>
